<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - HeartScan AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module" src="https://unpkg.com/@splinetool/viewer@1.0.67/build/spline-viewer.js"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center px-4 relative overflow-hidden">

  <!-- 3D Heart Spline - Bottom left corner -->
<div class="hidden lg:block absolute left-20 top-20 w-[400px] h-[400px] z-0">
    <spline-viewer url="https://prod.spline.design/FsICx2cotN6a8K8n/scene.splinecode" class="w-full h-full"></spline-viewer>
</div>

    <!-- Login Form Container -->
    <div class="relative z-10 bg-white shadow-2xl rounded-2xl p-10 max-w-md w-full border border-gray-200 backdrop-blur-sm">
        <h2 class="text-3xl font-bold text-center text-red-600 mb-6">HeartScan AI - Login</h2>

        {% if error %}
        <div class="bg-red-100 text-red-700 p-3 rounded-lg mb-4 text-center border border-red-300">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="{{ url_for('login') }}" class="space-y-6">
            <div>
                <label class="block text-gray-700 mb-2 font-medium">Username</label>
                <input type="text" name="username" required
                       class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-red-400 shadow-sm">
            </div>

            <div>
                <label class="block text-gray-700 mb-2 font-medium">Password</label>
                <input type="password" name="password" required
                       class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-red-400 shadow-sm">
            </div>

            <button type="submit"
                class="w-full bg-red-600 text-white py-2 rounded-xl font-semibold hover:bg-red-700 transition">Login</button>
        </form>
    </div>

</body>
</html>
